name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version and source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      npm-tag: ${{ steps.release.outputs.npm-tag }}
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Match tag, package and lockfile versions
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.cjs

  checks:
    name: Validate tagged package
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish validated version
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install locked dependencies and rebuild
        run: |
          npm ci
          npm run build
      - name: Revalidate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.cjs
      - name: Preview publication
        run: npm publish --dry-run --ignore-scripts --access public
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.version.outputs.npm-tag }}
        run: npm publish --ignore-scripts --access public --provenance --tag "$NPM_DIST_TAG"
